<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Polash AI OS</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="head">
        <img src="icons/icon-48.png" alt="">
        <div>
            <b>Polash AI OS</b>
            <span>Build • Learn • Earn • Grow</span>
        </div>
    </div>

    <button class="primary" id="open">
        <span>ড্যাশবোর্ড খুলুন</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
    </button>

    <div class="search">
        <input id="q" type="search" placeholder="৫০০+ AI টুল খুঁজুন…" autocomplete="off">
        <button id="find" title="Search">Search</button>
    </div>

    <div class="label">দ্রুত লিংক</div>
    <div class="grid">
        <button data-route="tools">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>AI টুলস<small>500+ catalog</small></span>
        </button>
        <button data-route="blog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M8 7h7M8 11h7"/></svg>
            <span>ইনসাইটস<small>Articles</small></span>
        </button>
        <button data-route="workspace">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5-9 4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
            <span>ওয়ার্কস্পেস<small>Assets & files</small></span>
        </button>
        <button data-route="aifree">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>
            <span>ফ্রি AI<small>No card needed</small></span>
        </button>
        <button data-route="career">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 12h18"/></svg>
            <span>ক্যারিয়ার<small>Freelance & jobs</small></span>
        </button>
        <button data-route="contact">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span>যোগাযোগ<small>Get in touch</small></span>
        </button>
    </div>

    <div class="foot">
        <span id="status">সাইটের সাথে সংযুক্ত</span>
        <a href="https://mipolash-prog.github.io/polash-ai-os/privacy-policy.html" target="_blank" rel="noopener">Privacy</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
